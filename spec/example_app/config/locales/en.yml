en:
  date:
    formats:
      default:
        "%m/%d/%Y"
      with_weekday:
        "%a %m/%d/%y"

  helpers:
    label:
      order:
        address: Address
        details: Details

  time:
    formats:
      default:
        "%a, %b %-d, %Y at %r"
      date:
        "%b %-d, %Y"
      short:
        "%B %d"

  titles:
    application: Administrate-prototype

  administrate:
    actions:
      cancel: Cancel
    controller:
      index:
        title: "%{resource}"
        subtitle: "%{count} %{resource}"
      new:
        subtitle: "Create a new %{resource}"
      show:
        subtitle: "Details for %{resource}"
      edit:
        subtitle: "Edit %{resource}"
    search:
      placeholder: Search %{resource}...
