---
name: CI
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3"]
    env:
      PGHOST: localhost
      PGUSER: administrate
      PGPASSWORD: administrate
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: administrate
          POSTGRES_DB: administrate_test
          POSTGRES_PASSWORD: administrate
        ports:
           - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Install Appraisal dependencies
        run: bundle exec appraisal install
      - name: Setup the environment
        run: cp .sample.env .env
      - run: cp spec/example_app/config/database.yml.sample spec/example_app/config/database.yml
      - name: Setup the database
        run: bundle exec rake db:setup
      - name: Run tests
        run: |
          if bundle exec appraisal rails81 rspec; then exit 0; fi
          # The feature specs drive a real headless Chrome, which occasionally
          # crashes its session under CI and takes an unrelated example down
          # with it. Retry only what failed, and only when RSpec lived long
          # enough to record what that was, so a hard crash still fails.
          if [ ! -s tmp/rspec_examples.txt ]; then
            echo "::error::RSpec did not record example statuses. Not retrying."
            exit 1
          fi
          if ! grep -q '| failed' tmp/rspec_examples.txt; then
            echo "::error::The run failed with no failed example recorded. Not retrying."
            exit 1
          fi
          echo "::warning::Retrying the failed examples, suspecting a browser flake."
          bundle exec appraisal rails81 rspec --only-failures
